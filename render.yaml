# Render Blueprint — cria o serviço web + PostgreSQL automaticamente
# Deploy: Dashboard Render → "New +" → "Blueprint" → liga este repositório.
databases:
  - name: plantamoz-db
    plan: free

services:
  - type: web
    name: plantamoz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn plantamoz_backend.wsgi:application --timeout 120 --workers 1 --max-requests 500
    healthCheckPath: /login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "plantamoz.onrender.com"
      - key: DB_NAME
        fromDatabase:
          name: plantamoz-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: plantamoz-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: plantamoz-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: plantamoz-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: plantamoz-db
          property: port