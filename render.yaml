# Render Blueprint — apenas o serviço web.
# A base de dados fica no NEON (PostgreSQL grátis): https://neon.tech
# Após criar o serviço, adiciona em "Environment" a variável:
#   DATABASE_URL = <connection string do Neon (com ?sslmode=require)>
services:
  - type: web
    name: plantamoz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn plantamoz_backend.wsgi:application --timeout 120 --workers 1 --max-requests 500
    healthCheckPath: /login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "plantamoz.onrender.com"