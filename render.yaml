# Render Blueprint — apenas o serviço web.
# A base de dados (PostgreSQL) cria-se pela dashboard da Render ("New +" → "PostgreSQL").
# Depois, em "Environment" deste serviço, define:
#   DATABASE_URL = Internal Database URL da base (…:5432/nomedb)
services:
  - type: web
    name: plantamoz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn plantamoz_backend.wsgi:application --timeout 120 --workers 1 --max-requests 500
    healthCheckPath: /login/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "plantamoz.onrender.com"
      # Preenche o valor na Render (aba Environment). sync:false impedido o
      # blueprint de o apagar em re-aplicações.
      - key: DATABASE_URL
        value: ""
        sync: false